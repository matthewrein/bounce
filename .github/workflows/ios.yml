name: iOS

# Checks every change to the native app the way the owner will build it, so building on the Mac is only for deploying:
# BounceCore's tests on Linux and macOS, then on a Mac exactly the README's steps (install XcodeGen, generate the
# project), that signing settings from Config/Local.xcconfig are picked up, unsigned builds for the Simulator and for
# iPhone with the runner's default and its newest Xcode, a launch in the iOS Simulator, and end-to-end UI tests on the
# app's demo scene (screenshots, a screen recording, the test log and results kept as artifacts; key numbers in the
# run's summary).

on:
  push:
    # native-ios is what the owner builds; a candidate is first pushed to a claude/ branch and must pass there before
    # native-ios moves to it, so native-ios only ever gets builds that passed
    branches: [native-ios, "claude/**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    name: BounceCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        run: swift test --package-path ios/BounceCore
      # The capture kit scorer on the synthetic kit (rendered here, known truth; no ffmpeg needed): its Markdown goes to
      # the run's summary. Fails if the scorer crashes or the median tilt error is absurd (over 2 degrees). Run twice:
      # with the app's own ball finder (the ball shots rendered at a real kit's 1440x1080), and with --truth-ball, a
      # finder that knows where the ball is, so the ball and bounce scoring itself is exercised on every change.
      - name: Capture kit scores (synthetic)
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          swift build -c release --package-path ios/BounceCore --product bounce-score
          swift run -c release --skip-build --package-path ios/BounceCore bounce-score --synthetic --markdown --max-tilt-error 2 | tee synthetic-scores.md
          swift run -c release --skip-build --package-path ios/BounceCore bounce-score --synthetic --truth-ball --markdown --quiet | tee synthetic-scores-truth-ball.md
          { cat synthetic-scores.md; echo; echo "#### With the truth-based ball finder (--truth-ball): the scorer's own check"; echo
            cat synthetic-scores-truth-ball.md; } >> "$GITHUB_STEP_SUMMARY"

  # The device budget (informational; never fails the run): each stage of the phone's per-frame processing timed on
  # synthetic 1920x1440 camera frames (optimised, as the app is built), the 60 fps budget with the app's cadence and
  # frame pacer, and an iPhone estimate from this Mac's times (bounce-bench). A package of its own (ios/BounceBench), so
  # BounceCore's tests never build it, and a job of its own, in parallel with the app's: it adds no time to the app's
  # legs and a failure here (continue-on-error) cannot fail the run. The Markdown goes to the run's summary and to the
  # log between BENCH-BEGIN and BENCH-END; the report is kept as an artifact.
  bench-macos:
    name: Device budget bench (macOS, informational)
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Device budget bench (bounce-bench)
        timeout-minutes: 35
        shell: bash
        run: |
          set -o pipefail
          sysctl -n machdep.cpu.brand_string hw.ncpu || true
          swift build -c release --package-path ios/BounceBench
          swift run -c release --skip-build --package-path ios/BounceBench bounce-bench --markdown bench.md --json bench.json
          echo "BENCH-BEGIN"
          cat bench.md
          echo "BENCH-END"
          cat bench.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the device budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-budget-bench
          path: |
            bench.md
            bench.json
          if-no-files-found: ignore

  app-macos:
    name: App (${{ matrix.xcode }} Xcode)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        xcode: [default, newest]
    steps:
      - uses: actions/checkout@v4

      - name: Choose Xcode
        run: |
          if [ "${{ matrix.xcode }}" = newest ]; then
            X=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
            echo "Using $X"; sudo xcode-select -s "$X"
          fi
          xcodebuild -version

      # --- the owner's steps from ios/README.md ---
      - name: "README step 1: install XcodeGen"
        run: brew install xcodegen
      - name: "README step 3: generate the Xcode project"
        run: cd ios && xcodegen generate

      - name: Signing settings from Config/Local.xcconfig are picked up (README step 5)
        run: |
          printf 'DEVELOPMENT_TEAM = ABCDE12345\nPRODUCT_BUNDLE_IDENTIFIER = io.github.example.SlabBounce\n' > ios/Config/Local.xcconfig
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Release -showBuildSettings > with-local.txt
          grep -E '^ *DEVELOPMENT_TEAM = ABCDE12345$' with-local.txt
          grep -E '^ *PRODUCT_BUNDLE_IDENTIFIER = io.github.example.SlabBounce$' with-local.txt
          rm ios/Config/Local.xcconfig
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Release -showBuildSettings > without-local.txt
          grep -E '^ *PRODUCT_BUNDLE_IDENTIFIER = io.github.matthewrein.SlabBounce$' without-local.txt

      - name: Pressing Run in Xcode builds the optimised (Release) configuration
        run: |
          S=ios/SlabBounce.xcodeproj/xcshareddata/xcschemes/SlabBounce.xcscheme
          python3 - "$S" <<'EOF'
          import re, sys
          s = open(sys.argv[1]).read()
          m = re.search(r'<LaunchAction[^>]*buildConfiguration\s*=\s*"([^"]+)"', s)
          print("LaunchAction configuration:", m and m.group(1))
          sys.exit(0 if m and m.group(1) == "Release" else 1)
          EOF

      - name: BounceCore tests (macOS, optimised; Linux runs them unoptimised)
        if: matrix.xcode == 'default'
        run: swift test -c release -Xswiftc -enable-testing --package-path ios/BounceCore

      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Debug
          -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build

      - name: Build for iPhone (Release, unsigned)
        run: >
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build

      - name: Launch in the iOS Simulator
        if: matrix.xcode == 'default'
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim -name 'SlabBounce.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$UDID" "$BID"
          sleep 10
          xcrun simctl spawn "$UDID" launchctl list | grep "$BID" || { echo "The app is not running 10 s after launch"; exit 1; }
          xcrun simctl io "$UDID" screenshot simulator.png
          xcrun simctl terminate "$UDID" "$BID" || true
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # The app's demo (a synthetic slab, as ARKit has no camera in the Simulator) driven by XCUITest: it must lock,
      # show the right tilt / apex / drop, re-lock after the slab is slid, copy diagnostics, record and share.
      - name: End-to-end UI tests in the Simulator (demo scene)
        # Blocking: a failing end-to-end test fails the run. A test that fails is run once more (a slow shared
        # Simulator can miss a time limit); its first failure still shows in the log and the summary below.
        if: matrix.xcode == 'default'
        timeout-minutes: 30
        run: |
          set +e
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force e2e.mp4 &
          REC=$!
          xcodebuild test -project ios/SlabBounce.xcodeproj -scheme SlabBounce -destination "id=$SIM_UDID" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath e2e.xcresult > e2e.log 2>&1
          status=$?
          kill -INT $REC; wait $REC
          grep -E "E2E-SUMMARY|Test Case '.*' (passed|failed)|error:|\*\* TEST" e2e.log
          {
            echo "### End-to-end in the Simulator (demo scene)"
            grep -h "E2E-SUMMARY" e2e.log | sed 's/^.*E2E-SUMMARY /- /'
            echo
            grep -E "Test Case '.*' (passed|failed)" e2e.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then echo "--- last lines of the test log ---"; tail -80 e2e.log; fi
          exit $status

      - name: Keep the Simulator screenshot, the end-to-end video, log and results
        if: matrix.xcode == 'default' && always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-e2e
          path: |
            simulator.png
            e2e.mp4
            e2e.log
            e2e.xcresult
          if-no-files-found: ignore
