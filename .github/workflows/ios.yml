name: iOS

on:
  push:
    branches: [native-ios]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-linux:
    name: BounceCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: swift test
        run: swift test --package-path ios/BounceCore

  app-macos:
    name: App build (macOS, Simulator and device, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        run: cd ios && xcodegen generate
      - name: BounceCore tests (macOS)
        run: swift test --package-path ios/BounceCore
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build for iPhone (Release, unsigned)
        run: >
          xcodebuild -project ios/SlabBounce.xcodeproj -scheme SlabBounce -configuration Release
          -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
